<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contact — HamShackTech</title>
<meta name="description" content="Get in touch with HamShackTech." />
<link rel="stylesheet" href="styles.css" />
<link rel="icon" href="img/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16.png" />
<link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
</head>
<body>

<header class="site-header">
<div class="wrap">
<a class="logo" href="index.html"><img src="img/logo.png" alt="HamShackTech — Amateur Radio in a Tech World" /></a>
<nav>
<a href="index.html#tutorials">Tutorials</a>
<a href="index.html#reviews">Reviews</a>
<a href="about.html">About</a>
<a href="contact.html">Contact</a>
</nav>
</div>
</header>

<section class="section page-hero">
<div class="wrap">
<h1>Contact</h1>
<p>
Questions, ideas, or your own ham shack tech projects — drop a note below.
</p>
</div>
</section>

<section class="section">
<div class="wrap">
<!--
  No backend on this static site, so this form posts to FormSubmit.co,
  a free forwarding service: submissions get emailed straight to
  contact@hamshacktech.com. The FIRST submission triggers a one-time
  confirmation email from FormSubmit to that inbox — someone has to
  click the link in it once before the form goes live. After that,
  every submission just arrives as a normal email, no dashboard,
  no account, no code to maintain.
-->
<form class="contact-form" action="https://formsubmit.co/contact@hamshacktech.com" method="POST">
<input type="hidden" name="_subject" value="New message from HamShackTech contact form" />
<input type="hidden" name="_template" value="table" />
<input type="hidden" name="_next" value="https://hamshacktech.com/contact.html?sent=1" />
<!-- Honeypot field: hidden from real visitors via CSS, but bots that
     auto-fill every field will trip it and FormSubmit silently drops
     the submission. -->
<input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off" />

<label for="name">Name</label>
<input type="text" id="name" name="name" required />

<label for="email">Email</label>
<input type="email" id="email" name="email" required />

<label for="message">Message</label>
<textarea id="message" name="message" rows="6" required></textarea>

<button type="submit" class="button">Send Message</button>
</form>

<p class="form-note" id="sent-note">
Thanks — your message is on its way. I'll get back to you soon.
</p>
</div>
</section>

<footer class="site-footer">
<div class="wrap">
<p>&copy; <span id="year"></span> HamShackTech. Built with 73s.</p>
</div>
</footer>

<script>
document.getElementById('year').textContent = new Date().getFullYear();
if (new URLSearchParams(window.location.search).get('sent') === '1') {
document.getElementById('sent-note').classList.add('visible');
}
</script>
</body>
</html>
