<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>HamShackTech CW Trainer</title>
<meta name="description" content="ICR and Code Groups Morse code trainers in one installable app that works offline.">
<meta name="theme-color" content="#1c1917">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  /* ===================== APP SHELL =====================
     The shell is deliberately thin: a title bar with two tabs, and below it
     one full-height frame per trainer. Each trainer runs in its own <iframe>
     so its CSS and JavaScript can't collide with the other's -- they're the
     same files as the web versions, just copied into this folder.
     Colors are the site's avocado palette, same hex values as the trainers. */
  :root {
    --chassis: #100e0c;      /* matches the trainers' page background */
    --bar: #1c1917;          /* stone-900 */
    --well: #292524;         /* stone-800 */
    --border: #44403c;       /* stone-700 */
    --text: #fafaf9;         /* stone-50 */
    --muted: #a8a29e;        /* stone-400 */
    --lime: #a3e635;         /* lime-400, the trainers' accent */
    --lime-ink: #1a2e05;     /* lime-950, text on a lime background */
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    flex-direction: column;
    background: var(--chassis);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- title bar ---------- */
  .bar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 14px;
    /* env(...) keeps the bar clear of a phone's notch / status bar */
    padding: calc(8px + env(safe-area-inset-top)) 14px 8px;
    background: var(--bar);
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand img { width: 30px; height: 30px; flex: none; }
  .brand h1 {
    margin: 0;
    font: 600 1.15rem/1 'Oswald', sans-serif;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }
  .brand h1 .site { color: var(--muted); font-weight: 500; }

  /* Segmented control: the two trainers as tabs. */
  .tabs {
    display: flex;
    padding: 3px;
    gap: 3px;
    background: var(--well);
    border: 1px solid var(--border);
    border-radius: 9px;
  }
  .tab {
    appearance: none;
    border: 0;
    border-radius: 6px;
    padding: 7px 14px;
    background: transparent;
    color: var(--muted);
    font: 500 0.95rem/1 'Oswald', sans-serif;
    letter-spacing: 0.03em;
    cursor: pointer;
  }
  .tab:hover { color: var(--text); }
  .tab[aria-selected="true"] { background: var(--lime); color: var(--lime-ink); }
  .tab:focus-visible, .install:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }

  .spacer { flex: 1; }

  /* "Ready offline" note: only appears once the app is fully saved locally. */
  .offline {
    display: none;
    align-items: center;
    gap: 6px;
    color: var(--muted);
    font-size: 0.8rem;
    white-space: nowrap;
  }
  .offline.ready { display: flex; }
  .offline::before {
    content: "";
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--lime);
  }

  /* Install button: only shown in a browser that offers installation and
     only while the app isn't already installed. */
  .install {
    display: none;
    border: 1px solid var(--lime);
    border-radius: 7px;
    padding: 6px 12px;
    background: transparent;
    color: var(--lime);
    font: 500 0.85rem/1 'Inter', sans-serif;
    cursor: pointer;
  }
  .install.show { display: block; }
  .install:hover { background: var(--lime); color: var(--lime-ink); }

  /* Home link: back to hamshacktech.com. Only shown when the app is open
     in a browser tab -- an installed app window has no use for it. */
  .home, .gear {
    flex: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 34px; height: 34px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--well);
    color: var(--muted);
    cursor: pointer;
  }
  .home:hover, .gear:hover { color: var(--lime); border-color: var(--lime); }
  .home:focus-visible, .gear:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }
  .home svg, .gear svg { width: 18px; height: 18px; }
  @media (display-mode: standalone) { .home { display: none; } }

  /* ---------- Settings panel (shared WPM / tone / volume) ---------- */
  .settings {
    width: min(420px, calc(100vw - 32px));
    padding: 22px 22px 18px;
    background: var(--bar);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 14px;
  }
  .settings::backdrop { background: rgba(0, 0, 0, 0.6); }
  .settings h2 { margin: 0 0 4px; font: 600 1.3rem/1.2 'Oswald', sans-serif; letter-spacing: 0.02em; }
  .settings .lede { margin: 0 0 18px; color: var(--muted); font-size: 0.88rem; line-height: 1.45; }
  .setting { margin-bottom: 16px; }
  .setting label { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 6px; }
  .setting output { font-family: 'Oswald', sans-serif; font-weight: 500; color: var(--lime); }
  .setting input[type="range"] { width: 100%; accent-color: var(--lime); }
  .settings .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
  .btn {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 14px;
    background: var(--well);
    color: var(--text);
    font: 500 0.9rem/1 'Inter', sans-serif;
    cursor: pointer;
  }
  .btn:hover { border-color: var(--lime); }
  .btn.primary { background: var(--lime); border-color: var(--lime); color: var(--lime-ink); }
  .btn:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }

  /* ---------- trainer frames ---------- */
  main { flex: 1; position: relative; min-height: 0; }
  main iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    background: var(--chassis);
  }
  main iframe[hidden] { display: none; }

  /* ---------- narrow screens (phones) ---------- */
  @media (max-width: 620px) {
    .bar { gap: 10px; padding-left: 10px; padding-right: 10px; }
    .brand h1 .site { display: none; }   /* "CW Trainer" is enough on a phone */
    .offline { display: none !important; }
    .tab { padding: 7px 11px; }
    .home { display: none; }             /* room is tight; the browser's Back works */
  }
  @media (max-width: 480px) {
    .brand h1 { display: none; }         /* mascot + tabs + gear only */
    .tab { padding: 7px 9px; font-size: 0.9rem; }
  }
</style>
</head>
<body>

<header class="bar">
  <a class="home" href="/" aria-label="Back to hamshacktech.com" title="Back to hamshacktech.com">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
  </a>
  <div class="brand">
    <img src="icons/apple-touch-icon.png" alt="" width="30" height="30">
    <h1><span class="site">HamShackTech</span> CW Trainer</h1>
  </div>
  <nav class="tabs" role="tablist" aria-label="Trainers">
    <button class="tab" role="tab" id="tab-icr" data-tab="icr"
            aria-controls="frame-icr" aria-selected="true">ICR</button>
    <button class="tab" role="tab" id="tab-code-groups" data-tab="code-groups"
            aria-controls="frame-code-groups" aria-selected="false">Code Groups</button>
    <button class="tab" role="tab" id="tab-progress" data-tab="progress"
            aria-controls="frame-progress" aria-selected="false">Progress</button>
  </nav>
  <div class="spacer"></div>
  <span class="offline" id="offlineNote" title="Everything is saved on this device, so the app opens without internet.">Ready offline</span>
  <button class="install" id="installBtn" type="button">Install app</button>
  <button class="gear" id="settingsBtn" type="button" aria-haspopup="dialog" aria-controls="settingsDialog" aria-label="Settings" title="Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
</header>

<!-- Settings shared by both trainers. The same three sliders also appear
     in each trainer's own settings; all of them stay in sync. -->
<dialog class="settings" id="settingsDialog" aria-labelledby="settingsTitle">
  <h2 id="settingsTitle">Settings</h2>
  <p class="lede">Speed, tone and volume apply to both trainers.</p>
  <div class="setting">
    <label for="setWpm">Character speed <output id="setWpmVal"></output></label>
    <input type="range" id="setWpm" min="5" max="40" step="1">
  </div>
  <div class="setting">
    <label for="setTone">Tone <output id="setToneVal"></output></label>
    <input type="range" id="setTone" min="300" max="1000" step="10">
  </div>
  <div class="setting">
    <label for="setVol">Volume <output id="setVolVal"></output></label>
    <input type="range" id="setVol" min="0" max="100" step="5">
  </div>
  <div class="actions">
    <button class="btn" id="sampleBtn" type="button">Play sample</button>
    <button class="btn primary" id="settingsDone" type="button">Done</button>
  </div>
</dialog>

<main>
  <!-- The first tab shown loads right away; the others load the first time
       their tab is opened (data-src), so only one starts up at launch. -->
  <iframe id="frame-icr" role="tabpanel" aria-labelledby="tab-icr"
          title="ICR Trainer" src="icr/"></iframe>
  <iframe id="frame-code-groups" role="tabpanel" aria-labelledby="tab-code-groups"
          title="Code Groups Trainer" data-src="code-groups/" hidden></iframe>
  <iframe id="frame-progress" role="tabpanel" aria-labelledby="tab-progress"
          title="Progress" data-src="progress/" hidden></iframe>
</main>

<script src="shared/hst-engine.js"></script>
<script>
(function () {
  'use strict';

  var TAB_KEY = 'hct-cw-trainer-app-tab';   // remembers the last tab used
  var tabs = Array.prototype.slice.call(document.querySelectorAll('.tab'));
  var current = null;

  // ------------------------------------------------------------------
  // Stop anything a trainer is playing. Called on the trainer being left,
  // so a hidden tab never keeps sending Morse in the background. It just
  // clicks the trainer's own Stop buttons -- the frames are on the same
  // site, so the shell can reach into them -- which means the trainers
  // themselves need no changes.
  // ------------------------------------------------------------------
  function stopTrainer(slug) {
    var frame = document.getElementById('frame-' + slug);
    var doc;
    try { doc = frame.contentDocument; } catch (e) { return; }
    if (!doc) return;

    // Click a button only if it's currently showing on screen.
    function clickIfVisible(id) {
      var btn = doc.getElementById(id);
      if (btn && btn.offsetParent !== null && !btn.disabled) btn.click();
    }
    // Click a button only if its label says it will stop something.
    function clickIfStop(id) {
      var btn = doc.getElementById(id);
      if (btn && /stop/i.test(btn.textContent)) btn.click();
    }

    if (slug === 'icr') {
      clickIfVisible('stopDrillBtn');    // a drill first (it may resume the session)...
      clickIfVisible('stopSessionBtn');  // ...then the session itself
    } else if (slug === 'code-groups') {
      clickIfStop('drillBtn');           // Code Groups relabels these buttons
      clickIfStop('sessionBtn');         // to "Stop ..." while running
    }                                    // (Progress has nothing to stop)
  }

  function showTab(slug, remember) {
    if (slug === current) return;
    if (current) stopTrainer(current);
    current = slug;

    tabs.forEach(function (t) {
      var on = t.dataset.tab === slug;
      t.setAttribute('aria-selected', on ? 'true' : 'false');
      t.tabIndex = on ? 0 : -1;          // arrow keys move between tabs
      var frame = document.getElementById(t.getAttribute('aria-controls'));
      if (on && frame.dataset.src) {     // first visit: load it now
        frame.src = frame.dataset.src;
        delete frame.dataset.src;
      }
      frame.hidden = !on;
    });

    if (remember) { try { localStorage.setItem(TAB_KEY, slug); } catch (e) {} }

    // Progress redraws each time it's opened, so it includes the session
    // that was just stopped by switching here.
    if (slug === 'progress') {
      try { document.getElementById('frame-progress').contentWindow.HSTProgress.refresh(); } catch (e) {}
    }

    // Hand keyboard focus to the trainer so typing goes straight to it.
    var active = document.getElementById('frame-' + slug);
    setTimeout(function () { try { active.contentWindow.focus(); } catch (e) {} }, 0);
  }

  tabs.forEach(function (t, i) {
    t.addEventListener('click', function () { showTab(t.dataset.tab, true); });
    // Left/right arrow keys switch tabs (standard tab-list keyboard behavior).
    t.addEventListener('keydown', function (e) {
      if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
      var next = tabs[(i + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length];
      next.focus();
      showTab(next.dataset.tab, true);
    });
  });

  // Which tab to open: a ?tab=icr / code-groups / progress link (the CW
  // Tools page and the old trainer addresses use these) wins; otherwise
  // the tab used last time; ICR the very first time.
  var TABS = ['icr', 'code-groups', 'progress'];
  var wanted = new URLSearchParams(location.search).get('tab');
  var saved = null;
  try { saved = localStorage.getItem(TAB_KEY); } catch (e) {}
  if (TABS.indexOf(wanted) >= 0) showTab(wanted, true);
  else showTab(TABS.indexOf(saved) >= 0 ? saved : 'icr', false);

  // ------------------------------------------------------------------
  // Settings panel. The sliders write to HST.shared (see
  // shared/hst-engine.js); both trainers listen for that change and
  // update themselves, so nothing here talks to the trainers directly.
  // ------------------------------------------------------------------
  var dlg = document.getElementById('settingsDialog');
  var fields = [
    { key: 'wpm',    input: 'setWpm',  out: 'setWpmVal',  fmt: function (v) { return v + ' WPM'; } },
    { key: 'toneHz', input: 'setTone', out: 'setToneVal', fmt: function (v) { return v + ' Hz'; } },
    { key: 'volume', input: 'setVol',  out: 'setVolVal',  fmt: function (v) { return v + '%'; } }
  ];
  function renderSettings(shared) {
    fields.forEach(function (f) {
      document.getElementById(f.input).value = shared[f.key];
      document.getElementById(f.out).textContent = f.fmt(shared[f.key]);
    });
  }
  fields.forEach(function (f) {
    document.getElementById(f.input).addEventListener('input', function (e) {
      var patch = {}; patch[f.key] = Number(e.target.value);
      HST.shared.set(patch);
    });
  });
  HST.shared.onChange(renderSettings);

  document.getElementById('settingsBtn').addEventListener('click', function () {
    stopTrainer(current);          // settings change between sessions, never mid-session
    renderSettings(HST.shared.get());
    dlg.showModal();
  });
  document.getElementById('settingsDone').addEventListener('click', function () { dlg.close(); });
  // Clicking the dimmed area outside the panel closes it too.
  dlg.addEventListener('click', function (e) { if (e.target === dlg) dlg.close(); });
  dlg.addEventListener('close', function () {
    HST.audio.stop();
    var active = document.getElementById('frame-' + current);
    try { active.contentWindow.focus(); } catch (e) {}
  });

  // "Play sample": sends CQ with the current settings so you can hear them.
  document.getElementById('sampleBtn').addEventListener('click', function () {
    var s = HST.shared.get();
    HST.audio.stop();
    HST.audio.playMorse(['C', 'Q'], { wpm: s.wpm, toneHz: s.toneHz, volume: s.volume });
  });

  // ------------------------------------------------------------------
  // Offline support: register the service worker (sw.js), then show
  // "Ready offline" once every file has been saved on this device.
  // ------------------------------------------------------------------
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker
      // updateViaCache 'none': always check the server for a new sw.js
      .register('sw.js', { scope: './', updateViaCache: 'none' })
      .catch(function (err) { console.warn('Offline support unavailable:', err); });

    navigator.serviceWorker.ready.then(function () {
      document.getElementById('offlineNote').classList.add('ready');
    });
  }

  // ------------------------------------------------------------------
  // Install button. Chrome and Edge fire "beforeinstallprompt" when the
  // app can be installed; we hold on to it and show our own button, which
  // is easier to find than the small icon in the address bar.
  // (Safari doesn't support this -- there it's Share > Add to Home Screen.)
  // ------------------------------------------------------------------
  var installBtn = document.getElementById('installBtn');
  var deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.classList.add('show');
  });
  installBtn.addEventListener('click', function () {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    deferredPrompt.userChoice.finally(function () {
      deferredPrompt = null;
      installBtn.classList.remove('show');
    });
  });
  window.addEventListener('appinstalled', function () {
    installBtn.classList.remove('show');
  });
})();
</script>
</body>
</html>
