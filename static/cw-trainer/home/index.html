<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home — HamShackTech CW Trainer</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../shared/hst-chrome.css">
<style>
  /* Home (Tim, 2026-11-04): the tab the app opens to. Same avocado palette
     and tool colors as the Progress tab. */
  :root {
    --bg: #100e0c;
    --panel: #1c1917;
    --well: #292524;
    --border: #44403c;
    --grid: #2f2a27;
    --text: #fafaf9;
    --muted: #c7c2be;
    --dim: #a8a29e;
    --icr: #a3e635;
    --cg: #34d399;
    --key: #fbbf24;
    --qso: #f472b6;
    --jep: #818cf8;
    --tp: #fb923c;
    --cs: #67e8f9;
    --zoom: #38bdf8;
    --onair: #c084fc;
    --other: #94a3b8;
    --hw: #c4b5fd;
    --lime-ink: #1a2e05;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 22px 18px 56px; }
  .head { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; margin-bottom: 6px; }
  .greet { margin: 0 0 16px; color: var(--muted); font: 500 1.1rem/1.4 'Oswald', sans-serif; letter-spacing: 0.02em; }
  .greet b { color: var(--icr); font-weight: 600; }

  /* ---------- tiles ---------- */
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
  .tile { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; min-width: 0; }
  .tile .val { font: 600 1.6rem/1.1 'Oswald', sans-serif; white-space: nowrap; }
  .tile .lbl { color: var(--muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; margin-top: 4px; }
  .tile .sub { color: var(--dim); font-size: 0.85rem; margin-top: 1px; }
  .ring { flex: none; }
  .ring .bgc { stroke: var(--well); }
  .ring .fg { stroke: var(--icr); transition: stroke-dashoffset 0.4s; }

  /* ---------- cards ---------- */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; min-width: 0; }
  .card.wide { margin-bottom: 16px; }
  .card h2 { margin: 0 0 2px; font: 600 1.05rem/1.3 'Oswald', sans-serif; letter-spacing: 0.04em; text-transform: uppercase; }
  .card .note { margin: 0 0 10px; color: var(--dim); font-size: 0.88rem; }
  .card-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-bottom: 8px; }
  .card-head .spacer { flex: 1; }
  .card-head h2 { margin: 0; }

  /* ---------- My CW Journey ---------- */
  .journey svg { display: block; width: 100%; height: auto; overflow: visible; }
  .journey text { font-family: 'Inter', system-ui, sans-serif; fill: var(--dim); font-size: 12px; }
  .journey .lvl { fill: var(--muted); font-size: 12px; font-weight: 500; }
  .journey .lvl.mine { fill: var(--hw); font-weight: 600; }
  .journey .you { fill: var(--icr); font: 600 14px 'Oswald', sans-serif; letter-spacing: 0.02em; }
  .jsum { margin: 10px 0 0; color: var(--muted); }
  .jsum b { color: var(--text); }
  .jsum .y { color: var(--icr); }
  .jsum .c { color: var(--hw); }

  /* ---------- course ---------- */
  .course-card { border-color: #5b4f86; }
  .big { font: 600 1.35rem/1.25 'Oswald', sans-serif; letter-spacing: 0.01em; margin: 4px 0 2px; }
  .big .when { color: var(--hw); }
  .focus { color: var(--muted); margin: 0 0 8px; }
  .tasks { list-style: none; margin: 6px 0 10px; padding: 0; }
  .tasks li { position: relative; padding: 5px 0 5px 26px; border-top: 1px solid var(--grid); }
  .tasks li:first-child { border-top: 0; }
  .tasks li::before { content: ""; position: absolute; left: 2px; top: 9px; width: 13px; height: 13px; border: 2px solid var(--border); border-radius: 3px; }
  .tasks li.done { color: var(--dim); }
  .tasks li.done::before { content: "\2713"; border-color: var(--hw); background: var(--hw); color: #1c1917; font: 700 11px/13px 'Inter', sans-serif; text-align: center; }
  .tasks .also { color: var(--dim); font-size: 0.85rem; }
  .more { color: var(--dim); font-size: 0.88rem; margin: -4px 0 10px; }
  .daytag { display: inline-block; margin-left: 8px; color: var(--dim); font: 500 0.88rem/1 'Inter', sans-serif; letter-spacing: 0; }
  a { color: var(--icr); }
  .course-card a { color: var(--hw); }
  .doneall { color: var(--hw); font-weight: 600; margin: 6px 0 8px; }

  .btn {
    appearance: none; border: 1px solid var(--border); background: var(--well); color: var(--text);
    border-radius: 9px; padding: 8px 14px; font: 500 0.92rem/1.2 'Inter', sans-serif; cursor: pointer;
  }
  .btn:hover { border-color: #57534e; }
  .btn.primary { background: var(--icr); border-color: var(--icr); color: var(--lime-ink); font-weight: 600; }
  .btn.violet { background: transparent; border-color: var(--hw); color: var(--hw); }
  .btn:focus-visible, .range button:focus-visible, a:focus-visible { outline: 2px solid var(--icr); outline-offset: 2px; }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; }

  /* ---------- practice time pie ---------- */
  .range { display: flex; padding: 3px; gap: 3px; background: var(--well); border: 1px solid var(--border); border-radius: 9px; }
  .range button { border: 0; border-radius: 6px; padding: 5px 10px; background: transparent; color: var(--muted); font: 500 0.85rem/1 'Inter', sans-serif; cursor: pointer; }
  .range button[aria-pressed="true"] { background: var(--icr); color: var(--lime-ink); }
  .pie { display: flex; flex-direction: column; align-items: center; margin: 4px 0 12px; }
  .pie svg { display: block; max-width: 100%; height: auto; }
  .pie path:hover { opacity: 0.85; }
  .pie .tot { margin-top: 8px; color: var(--muted); font-size: 0.9rem; }
  .pie .tot b { color: var(--text); font: 600 1.15rem 'Oswald', sans-serif; margin-right: 4px; }
  .plist { list-style: none; margin: 0; padding: 0; width: 100%; }
  .plist li { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto 3.4em; align-items: center; gap: 10px; padding: 7px 0; border-top: 1px solid var(--grid); font-size: 0.95rem; }
  .plist li:first-child { border-top: 0; }
  .plist .sw { width: 12px; height: 12px; border-radius: 3px; }
  .plist .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .plist .mn { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
  .plist .pc { color: var(--dim); text-align: right; font-variant-numeric: tabular-nums; }
  .nodata { color: var(--dim); padding: 18px 0; }

  /* ---------- characters / pick up ---------- */
  .chars { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 12px; }
  .chip { display: inline-flex; flex-direction: column; align-items: center; min-width: 52px; padding: 6px 8px; background: var(--well); border: 1px solid var(--border); border-radius: 9px; }
  .chip b { font: 600 1.35rem/1.1 'JetBrains Mono', monospace; }
  .chip span { color: var(--dim); font-size: 0.78rem; }
  .sep { border: 0; border-top: 1px solid var(--grid); margin: 14px 0; }
  .tips { margin: 0; padding-left: 18px; color: var(--muted); }
  .tips li { margin: 3px 0; }

  /* ---------- On Air Practice (Tim, 2026-11-05) ---------- */
  .tzpick { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 0.88rem; }
  .tzpick select { height: 34px; padding: 0 30px 0 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--well); color: var(--text); font: 500 0.9rem 'Inter', sans-serif; }
  .air-day { margin: 0 0 8px; color: var(--muted); font-size: 0.9rem; }
  /* The left column: Next Class above On Air Practice, which grows to the pie's height. */
  .col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .col > .card { margin: 0; }
  .col > .card:last-child { flex: 1; }
  .air-dh { margin: 14px 0 2px; padding-top: 10px; border-top: 1px solid var(--border); font: 600 0.95rem/1.3 'Oswald', sans-serif; letter-spacing: 0.04em; color: var(--text); }
  .air-grp:first-of-type .air-dh { margin-top: 4px; padding-top: 0; border-top: 0; }
  .air-dh span { color: var(--dim); font: 500 0.82rem 'Inter', sans-serif; letter-spacing: 0; margin-left: 6px; }
  .air-none { margin: 2px 0 0; color: var(--dim); font-size: 0.9rem; }
  .air-more { margin: 0; color: var(--dim); font-size: 0.88rem; }
  .air-more:empty { display: none; }
  .air-list { list-style: none; margin: 0; padding: 0; }
  .air-list li { display: grid; grid-template-columns: 8.5em minmax(0, 1fr); gap: 4px 16px; padding: 10px 0; border-top: 1px solid var(--grid); }
  .air-list li:first-child { border-top: 0; }
  .air-time { font: 600 0.98rem/1.35 'JetBrains Mono', monospace; color: var(--text); }
  .air-time .t { display: inline-block; white-space: nowrap; }   /* a long local time wraps between start and end, never inside one */
  .air-time .tz { display: block; font: 500 0.78rem 'Inter', sans-serif; color: var(--dim); letter-spacing: 0.04em; }
  .air-what b { font-weight: 600; }
  .air-what .where { color: var(--muted); font-size: 0.9rem; }
  .air-what .info { margin: 3px 0 0; color: var(--dim); font-size: 0.88rem; }
  .air-what .more { margin: 4px 0 0; font-size: 0.9rem; }
  .air-what .more a { font-weight: 600; }
  .air-tag { display: inline-block; margin-left: 8px; padding: 1px 8px; border-radius: 999px; font: 600 0.75rem/1.5 'Inter', sans-serif; vertical-align: 1px; }
  .air-tag.now { background: var(--icr); color: var(--lime-ink); }
  .air-tag.soon { border: 1px solid var(--icr); color: var(--icr); }
  .air-tag.done { border: 1px solid var(--border); color: var(--dim); }
  li.past .air-time, li.past .air-what b { color: var(--dim); }

  @media (max-width: 760px) {
    .tiles { grid-template-columns: 1fr 1fr; }
    .grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 420px) {
    .wrap { padding: 16px 12px 40px; }
    .tile { padding: 12px; gap: 10px; }
    .tile .val { font-size: 1.35rem; }
    .air-list li { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="head hst-masthead">
    <img class="hst-mascot" src="../icons/apple-touch-icon.png" alt="HamShackTech alien mascot" width="40" height="40">
    <h1 class="hst-title">Home</h1>
  </div>
  <p class="greet" id="greet"></p>

  <div class="tiles">
    <div class="tile">
      <svg class="ring" width="54" height="54" viewBox="0 0 54 54" aria-hidden="true">
        <circle class="bgc" cx="27" cy="27" r="22" fill="none" stroke-width="7"/>
        <circle class="fg" id="todayRing" cx="27" cy="27" r="22" fill="none" stroke-width="7" stroke-linecap="round"
                transform="rotate(-90 27 27)" stroke-dasharray="138.2" stroke-dashoffset="138.2"/>
      </svg>
      <div><div class="val" id="tToday">0 min</div><div class="lbl">Today</div><div class="sub" id="tTodaySub">of 60 min</div></div>
    </div>
    <div class="tile"><div><div class="val" id="tStreak">0 days</div><div class="lbl">Day streak</div><div class="sub" id="tStreakSub"></div></div></div>
    <div class="tile"><div><div class="val" id="tWeek">0 min</div><div class="lbl">Last 7 days</div><div class="sub" id="tWeekSub"></div></div></div>
    <div class="tile"><div><div class="val" id="tTotal">0 min</div><div class="lbl">All practice</div><div class="sub" id="tTotalSub"></div></div></div>
  </div>

  <section class="card wide journey" aria-labelledby="jTitle">
    <h2 id="jTitle">My CW Journey</h2>
    <p class="note">Your true copy speed (without Farnsworth).</p>
    <div id="jChart"></div>
    <p class="jsum" id="jSum"></p>
  </section>

  <!-- Two half-width columns (one on phones; Tim, 2026-11-05): on the
       left Next Class (when you've chosen a course) above On Air
       Practice, on the right where your practice time goes. Next Homework
       and Keep Going came off. -->
  <div class="grid" id="lowerGrid">
    <div class="col">
      <section class="card course-card" id="nextClassCard" aria-labelledby="ncTitle" hidden>
        <h2 id="ncTitle">Next Class</h2>
        <div id="nextClass"></div>
      </section>
      <!-- On Air Practice (Tim, 2026-11-05): today's events from the
           "CW Trainer Contests" Google Calendar, via /api/contests. -->
      <section class="card" aria-labelledby="airTitle">
        <div class="card-head">
          <h2 id="airTitle">On Air Practice</h2>
          <span class="spacer"></span>
          <label class="tzpick">Display Times
            <select id="airTz">
              <option value="utc">UTC</option>
              <option value="local">Local</option>
            </select>
          </label>
        </div>
        <div id="air"><p class="note">Loading today&rsquo;s events&hellip;</p></div>
      </section>
    </div>
    <section class="card" aria-labelledby="pTitle">
      <div class="card-head">
        <h2 id="pTitle">Where My Practice Time Goes</h2>
        <span class="spacer"></span>
        <div class="range" role="group" aria-label="Time range">
          <button type="button" data-days="7">7 days</button>
          <button type="button" data-days="30">30 days</button>
          <button type="button" data-days="0">All</button>
        </div>
      </div>
      <div id="pie"></div>
    </section>
  </div>

  <footer class="hst-foot">
    <div class="hst-73"><b>73</b> Practice often, don&rsquo;t quit and have fun</div>
    <div class="hst-copy">&copy; HamShackTech LLC 2026</div>
  </footer>
</div>

<script src="../shared/hst-engine.js"></script>
<script src="../shared/hst-course.js"></script>
<script>
(function () {
  'use strict';
  var HST = window.HST;
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  var DAY = 86400000;
  function dayStart(t) { var d = new Date(t); return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(); }
  function addDays(t, n) { var d = new Date(t); return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n).getTime(); }
  function fmtMin(ms) {
    var m = Math.round(ms / 60000);
    if (ms > 0 && m < 1) return '< 1 min';
    return m < 60 ? m + ' min' : Math.floor(m / 60) + ' h ' + (m % 60 ? (m % 60) + ' min' : '');
  }
  function plural(n, w) { return n + ' ' + w + (n === 1 ? '' : 's'); }

  // Open a tool through the app shell (or, on its own, the app at that tool).
  function openTool(slug, q) {
    try { if (window.parent !== window && window.parent.HCT && window.parent.HCT.openTool) { window.parent.HCT.openTool(slug, q || ''); return; } } catch (e) {}
    window.top.location.href = '../?tab=' + slug + (q ? '&' + q : '');
  }
  function openScale(key) {
    try { if (window.parent !== window && window.parent.HCT && window.parent.HCT.openScale) { window.parent.HCT.openScale(key); return; } } catch (e) {}
    window.top.location.href = '../?tab=keyer&scale=' + key;
  }
  document.addEventListener('click', function (e) {
    var a = e.target.closest('[data-tool]');
    if (a) { e.preventDefault(); openTool(a.dataset.tool, a.dataset.q || ''); return; }
    var sc = e.target.closest('[data-scale]');
    if (sc) { e.preventDefault(); openScale(sc.dataset.scale); return; }
    if (e.target.closest('[data-open-settings]')) {
      try { window.parent.document.getElementById('settingsBtn').click(); } catch (err) {}
    }
  });

  /* ---------------- practice history ---------------- */
  // The same categories and colors as the Progress tab's Practice time chart.
  var COLORS = { icr: 'var(--icr)', 'code-groups': 'var(--cg)', 'call-signs': 'var(--cs)', keyer: 'var(--key)', qso: 'var(--qso)',
                 'test-prep': 'var(--tp)', jeopardy: 'var(--jep)', homework: 'var(--hw)', zoom: 'var(--zoom)', 'on-air': 'var(--onair)', other: 'var(--other)' };
  var NAMES = { icr: 'ICR', 'code-groups': 'Code Groups', 'call-signs': 'Call Signs', keyer: 'Keyer Practice', qso: 'QSO Practice',
                'test-prep': 'Test Prep', jeopardy: 'Jeopardy', homework: 'Homework', zoom: 'Zoom Sessions', 'on-air': 'On-Air', other: 'Other' };
  var ORDER = Object.keys(COLORS);
  var TOOL_OF = { icr: 'icr', 'code-groups': 'code-groups', 'call-signs': 'call-signs', keyer: 'keyer', qso: 'qso', 'test-prep': 'test-prep', jeopardy: 'jeopardy' };
  function catOf(s) {
    if (s.trainer !== 'manual') return COLORS[s.trainer] ? s.trainer : 'other';
    return ['zoom', 'on-air', 'other', 'homework'].indexOf(s.kind) >= 0 ? s.kind : 'other';
  }
  // Homework time counts only while its tick in My Course is there (as on Progress).
  function counted(rows) {
    var prog = {};
    return rows.filter(function (s) {
      if (s.trainer !== 'manual' || s.kind !== 'homework' || !s.course || !s.task) return true;
      var p = prog[s.course] || (prog[s.course] = HST.course.progress.get(s.course)), e = p[s.task];
      return !!(e && e.hw && e.hw.indexOf(s.uid) >= 0);
    });
  }
  function streaks(rows) {
    var days = {};
    rows.forEach(function (s) { days[dayStart(s.start)] = true; });
    var keys = Object.keys(days).map(Number).sort(function (a, b) { return a - b; });
    var best = 0, run = 0, prev = null;
    keys.forEach(function (d) { run = (prev !== null && addDays(prev, 1) === d) ? run + 1 : 1; best = Math.max(best, run); prev = d; });
    var today = dayStart(Date.now()), cur = 0, c = days[today] ? today : addDays(today, -1);
    while (days[c]) { cur++; c = addDays(c, -1); }
    return { current: cur, best: best, practicedToday: !!days[today] };
  }

  /* ---------------- copy speed ----------------
     Your copy speed: the fastest real speed (the Farnsworth spacing speed
     when that's slower than the characters) at which you copied 90% or
     more in a Code Groups or Call Signs session of 20+ characters in the
     last 30 days. ICR isn't counted: it plays one character at a time, so
     it has no word speed. */
  var GOOD = 0.9, MIN_CHARS = 20, RECENT_DAYS = 30;
  function charWpm(s) {
    if (s.trainer === 'call-signs') {
      var it = (s.items || []).filter(function (x) { return x.wpm; });
      if (s.mode === 'run' && it.length) return Math.round(it.reduce(function (t, x) { return t + x.wpm; }, 0) / it.length);
      if (s.wpm) return s.wpm;
      return s.minWpm && s.maxWpm ? Math.round((s.minWpm + s.maxWpm) / 2) : 0;
    }
    return s.wpm || 0;
  }
  function realWpm(s) { var w = charWpm(s); return s.fwpm && s.fwpm < w ? s.fwpm : w; }
  function copySpeed(rows) {
    var since = Date.now() - RECENT_DAYS * DAY, best = null;
    rows.forEach(function (s) {
      if ((s.trainer !== 'code-groups' && s.trainer !== 'call-signs') || s.start < since) return;
      if ((s.charsTotal || 0) < MIN_CHARS || s.charsCorrect / s.charsTotal < GOOD) return;
      var w = realWpm(s);
      if (w > 0 && (!best || w > best.wpm || (w === best.wpm && s.start > best.when))) best = { wpm: w, when: s.start, trainer: s.trainer };
    });
    return best;
  }

  /* ---------------- course ----------------
     The class dates and "next class" work as on My Course (course/index.html). */
  function parseDate(s) { var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
  function fmtLong(d) { return d.toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' }); }
  function fmt(d) { return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' }); }
  function fmtTime(hhmm) {
    var m = /^(\d{2}):(\d{2})$/.exec(hhmm || '');
    return m ? new Date(2000, 0, 1, +m[1], +m[2]).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }) : '';
  }
  var CLASS_MINUTES = 60;
  function startOf(d, times) { var m = /^(\d{2}):(\d{2})$/.exec(times[d.getDay()] || ''); return m ? new Date(d.getFullYear(), d.getMonth(), d.getDate(), +m[1], +m[2]) : d; }
  function overAt(d, times) {
    return times[d.getDay()] ? new Date(startOf(d, times).getTime() + CLASS_MINUTES * 60000) : new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1);
  }
  function classDates(first, days, count) {
    var out = [first], d = new Date(first);
    for (var i = 0; out.length < count && i < 400; i++) {
      d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1);
      if (days.indexOf(d.getDay()) >= 0) out.push(d);
    }
    return out;
  }
  // The class's speed from the curriculum ('25/6' -> 6, the real speed; '13' -> 13).
  function classWpm(sp) { var m = /^(\d+)(?:\/(\d+))?$/.exec(sp || ''); return m ? Number(m[2] || m[1]) : 0; }

  // Where the course is: { c, info, dates, idx (next class), pre, prog, ck } or null.
  function courseState() {
    var c = HST.course.get(), info = c.program ? HST.course.info(c.program, c.level) : null;
    if (!info) return c.program ? { c: c, info: null } : null;
    var first = parseDate(c.firstClass), now = new Date(), st = { c: c, info: info, first: first };
    if (!first) return st;
    var bars = info.sessions.some(function (s) { return s[2]; });
    var preFirst = bars && c.pre ? parseDate(c.preFirst) : null;
    if (preFirst && preFirst < first) {
      var pd = classDates(preFirst, c.days, info.sessions.length).filter(function (d) { return d < first; });
      for (var i = 0; i < pd.length; i++) if (overAt(pd[i], c.times) > now) {
        st.pre = true; st.dates = pd; st.idx = i; st.ck = HST.course.preKey(c.program, c.level);
        st.prog = HST.course.progress.get(st.ck);
        return st;
      }
    }
    st.dates = classDates(first, c.days, info.sessions.length);
    st.idx = -1;
    for (var j = 0; j < st.dates.length; j++) if (overAt(st.dates[j], c.times) > now) { st.idx = j; break; }
    st.ck = c.program + ':' + c.level;
    st.prog = HST.course.progress.get(st.ck);
    return st;
  }

  }

  /* ---------------- My CW Journey ----------------
     A road from 0 to 30 WPM: the CW Academy levels along it, your copy
     speed, and your class's speed when you're in a course. (The license
     test and CWops milestones came off, Tim 2026-11-04.) */
  var LEVELS = [
    { key: 'beginner', name: 'Beginner', short: 'Beg.', from: 0, to: 6 },
    { key: 'fundamental', name: 'Fundamental', short: 'Fund.', from: 6, to: 10 },
    { key: 'intermediate', name: 'Intermediate', short: 'Inter.', from: 10, to: 20 },
    { key: 'advanced', name: 'Advanced', short: 'Adv.', from: 20, to: 30 }
  ];
  var MAX = 30;
  var last = { speed: null, cls: null, level: '' };
  function drawJourney() {
    var el = $('jChart'), W = Math.max(280, el.clientWidth || 600), padL = 14, padR = 16;
    var x = function (w) { return padL + (W - padL - padR) * Math.min(w, MAX) / MAX; };
    var yLvl = 16, yTrack = 52, th = 16, yAxis = yTrack + th + 18, H = yAxis + 16;
    var svg = '';
    var sp = last.speed ? last.speed.wpm : 0;
    // Level names over the road, and a faint band for each.
    LEVELS.forEach(function (l, i) {
      var x1 = x(l.from), x2 = x(l.to), mine = last.level === l.key, w = x2 - x1;
      var label = w > l.name.length * 7.2 ? l.name : w > l.short.length * 7.2 ? l.short : '';
      svg += '<rect x="' + (x1 + (i ? 1 : 0)).toFixed(1) + '" y="' + (yLvl + 8) + '" width="' + (w - (i ? 1 : 0)).toFixed(1) + '" height="' + (yTrack - yLvl - 12) +
             '" rx="3" fill="' + (mine ? 'rgba(196,181,253,0.22)' : 'rgba(168,162,158,0.10)') + '"><title>CW Academy ' + l.name + ': ' + l.from + '–' + l.to + ' WPM</title></rect>';
      if (label) svg += '<text class="lvl' + (mine ? ' mine' : '') + '" x="' + ((x1 + x2) / 2).toFixed(1) + '" y="' + yLvl + '" text-anchor="middle">' + label + '</text>';
    });
    // The road, filled up to your speed.
    svg += '<rect x="' + x(0) + '" y="' + yTrack + '" width="' + (x(MAX) - x(0)).toFixed(1) + '" height="' + th + '" rx="8" fill="var(--well)" stroke="var(--border)"/>';
    if (sp > 0) svg += '<rect x="' + x(0) + '" y="' + yTrack + '" width="' + Math.max(th, x(sp) - x(0)).toFixed(1) + '" height="' + th + '" rx="8" fill="var(--icr)"/>';
    // WPM scale
    for (var w = 0; w <= MAX; w += 5) {
      svg += '<text x="' + x(w).toFixed(1) + '" y="' + yAxis + '" text-anchor="middle">' + w + '</text>';
    }
    svg += '<text x="' + x(MAX).toFixed(1) + '" y="' + (yAxis + 13) + '" text-anchor="end" style="font-size:10.5px">WPM</text>';
    // Your class's speed: a violet diamond on the road.
    if (last.cls) {
      var cx = x(last.cls.wpm), cy = yTrack + th / 2;
      svg += '<g><title>Your class: ' + last.cls.wpm + ' WPM</title><path d="M' + cx.toFixed(1) + ' ' + (cy - 9) + ' l9 9 -9 9 -9 -9z" fill="var(--hw)" stroke="#1c1917" stroke-width="2"/></g>';
    }
    // You: a lime dot with your speed over it.
    if (sp > 0) {
      var yx = x(sp), yy = yTrack + th / 2;
      svg += '<g><title>Your copy speed: ' + sp + ' WPM</title><circle cx="' + yx.toFixed(1) + '" cy="' + yy + '" r="11" fill="var(--icr)" stroke="#100e0c" stroke-width="3"/></g>';
      var lx = Math.min(Math.max(yx, 30), W - 30);
      svg += '<text class="you" x="' + lx.toFixed(1) + '" y="' + (yTrack - 10) + '" text-anchor="middle" style="paint-order:stroke;stroke:#1c1917;stroke-width:4px">' + sp + ' WPM</text>';
    }
    el.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" role="img" aria-label="My CW Journey: ' +
      (sp ? 'copy speed ' + sp + ' WPM' : 'no copy speed yet') + ' on the road to 30 WPM">' + svg + '</svg>';
  }
  function renderJourney(rows, st) {
    last.speed = copySpeed(rows);
    last.level = st && st.info ? (st.c.level === 'intermediate-prototype' ? 'intermediate' : st.c.level) : '';
    last.cls = null;
    if (st && st.info && st.c.program === 'cwa' && st.dates) {
      var i = st.idx < 0 ? st.dates.length - 1 : st.idx, w = 0;
      for (var k = i; k >= 0 && !w; k--) w = classWpm(st.info.sessions[k][0]);   // the latest speed the curriculum gives
      if (w) last.cls = { wpm: w, session: i + 1 };
    }
    drawJourney();
    var sp = last.speed, sum = '';
    if (sp) {
      var lvl = LEVELS.filter(function (l) { return sp.wpm >= l.from && sp.wpm < l.to; })[0];
      var next = LEVELS.filter(function (l) { return l.from > sp.wpm; })[0];
      sum = 'You copy at <b class="y">' + sp.wpm + ' WPM</b>' + (lvl ? ', in CW Academy ' + lvl.name + ' territory' : ', past the end of the road. Outstanding!') + '. ' +
        (next ? 'Next stop: <b>' + next.name + '</b> at ' + next.from + ' WPM, ' + (next.from - sp.wpm) + ' WPM to go.' : sp.wpm < MAX ? 'Next stop: ' + MAX + ' WPM.' : '');
    } else {
      sum = 'Finish a <a href="../?tab=code-groups" data-tool="code-groups">Code Groups</a> or <a href="../?tab=call-signs" data-tool="call-signs">Call Signs</a> session of ' + MIN_CHARS +
        ' characters or more with ' + Math.round(GOOD * 100) + '% right, and your place on the road shows here.';
    }
    $('jSum').innerHTML = sum;
  }

  /* ---------------- practice time pie ---------------- */
  var RANGE_KEY = 'hct-cw-home-range', range = 30;
  try { var rv = localStorage.getItem(RANGE_KEY); if (rv !== null && /^(0|7|30)$/.test(rv)) range = Number(rv); } catch (e) {}
  Array.prototype.forEach.call(document.querySelectorAll('.range button'), function (b) {
    b.addEventListener('click', function () {
      range = Number(b.dataset.days);
      try { localStorage.setItem(RANGE_KEY, String(range)); } catch (e) {}
      renderPie(lastRows);
      fitAir();
    });
  });
  // One wedge of the pie, clockwise from 12 o'clock.
  function wedge(cx, cy, r, a0, a1) {
    function pt(a) { return (cx + r * Math.sin(a)).toFixed(2) + ' ' + (cy - r * Math.cos(a)).toFixed(2); }
    return 'M' + cx + ' ' + cy + ' L' + pt(a0) + ' A' + r + ' ' + r + ' 0 ' + (a1 - a0 > Math.PI ? 1 : 0) + ' 1 ' + pt(a1) + 'Z';
  }
  function renderPie(rows) {
    document.querySelectorAll('.range button').forEach(function (b) { b.setAttribute('aria-pressed', String(Number(b.dataset.days) === range)); });
    var from = range ? addDays(dayStart(Date.now()), -(range - 1)) : 0;
    var ms = {}, total = 0;
    rows.forEach(function (s) {
      if (s.start < from) return;
      var k = catOf(s), d = s.durationMs || 0;
      ms[k] = (ms[k] || 0) + d; total += d;
    });
    if (total < 30000) {
      $('pie').innerHTML = '<p class="nodata">No practice ' + (range ? 'in the last ' + range + ' days' : 'yet') + '. Time you spend in each tool shows here.</p>';
      return;
    }
    var cats = ORDER.filter(function (k) { return ms[k] > 0; }).sort(function (a, b) { return ms[b] - ms[a]; });
    var S = 200, r = 96, a = 0, paths = '';
    cats.forEach(function (k) {
      var share = ms[k] / total, a1 = a + share * 2 * Math.PI;
      var tip = NAMES[k] + ': ' + fmtMin(ms[k]) + ' (' + Math.round(share * 100) + '%)';
      if (share > 0.9999) paths += '<circle cx="' + S / 2 + '" cy="' + S / 2 + '" r="' + r + '" fill="' + COLORS[k] + '"><title>' + esc(tip) + '</title></circle>';
      else paths += '<path d="' + wedge(S / 2, S / 2, r, a, a1) + '" fill="' + COLORS[k] + '" stroke="#1c1917" stroke-width="1.5" stroke-linejoin="round"><title>' + esc(tip) + '</title></path>';
      a = a1;
    });
    var label = range ? 'in the last ' + range + ' days' : 'all time';
    $('pie').innerHTML = '<div class="pie"><svg width="' + S + '" height="' + S + '" viewBox="0 0 ' + S + ' ' + S + '" role="img" aria-label="Practice time by tool, ' + label + '">' + paths + '</svg>' +
      '<div class="tot"><b>' + esc(fmtMin(total)) + '</b>' + esc(label) + '</div></div>' +
      '<ul class="plist">' + cats.map(function (k) {
        var nm = TOOL_OF[k] ? '<a href="../?tab=' + TOOL_OF[k] + '" data-tool="' + TOOL_OF[k] + '" style="color:inherit;text-decoration:none">' + NAMES[k] + '</a>' : NAMES[k];
        return '<li><span class="sw" style="background:' + COLORS[k] + '"></span><span class="nm">' + nm + '</span><span class="mn">' + esc(fmtMin(ms[k])) +
          '</span><span class="pc">' + Math.round(100 * ms[k] / total) + '%</span></li>';
      }).join('') + '</ul>';
  }

  /* ---------------- tiles and greeting ---------------- */
  var TARGET_MIN = 60;   // the Progress tab's Target Time: an hour a day
  function renderTiles(rows) {
    var now = Date.now(), today = dayStart(now), wk = addDays(today, -6), todayMs = 0, weekMs = 0, all = 0, weekDays = {};
    rows.forEach(function (s) {
      var d = s.durationMs || 0, end = Math.min(now, s.end || (s.start + d));
      all += d;
      if (end > today) todayMs += Math.min(d, end - Math.max(s.start, today));
      if (s.start >= wk) { weekMs += d; weekDays[dayStart(s.start)] = 1; }
    });
    var st = streaks(rows), mins = todayMs / 60000;
    $('tToday').textContent = fmtMin(todayMs).replace('< 1 min', '<1 min');
    $('tTodaySub').textContent = mins >= TARGET_MIN ? 'target met!' : 'of ' + TARGET_MIN + ' min target';
    $('todayRing').setAttribute('stroke-dashoffset', (138.2 * (1 - Math.min(1, mins / TARGET_MIN))).toFixed(1));
    $('tStreak').textContent = plural(st.current, 'day');
    $('tStreakSub').textContent = 'best ' + plural(st.best, 'day');
    $('tWeek').textContent = fmtMin(weekMs);
    $('tWeekSub').textContent = 'on ' + plural(Object.keys(weekDays).length, 'day') + ' of 7';
    $('tTotal').textContent = fmtMin(all);
    $('tTotalSub').textContent = plural(rows.length, 'session');
    var h = new Date().getHours(), hello = h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
    // Tim, 2026-11-04: "[Good afternoon] Welcome to HamShackTech CW Trainer."
    $('greet').textContent = hello + '! Welcome to HamShackTech CW Trainer.';
  }

  /* ---------------- On Air Practice ----------------
     Today's events from Tim's "CW Trainer Contests" Google Calendar
     (functions/api/contests.js reads it), in UTC or local time. "Today"
     is today in the zone you pick; local time is this device's own time
     zone. The events are fetched for the days around now and kept for
     15 minutes; the panel redraws every minute so "On now" stays right. */
  var TZ_KEY = 'hct-cw-home-tz';
  var airTz = 'local';
  try { var tzv = localStorage.getItem(TZ_KEY); if (tzv === 'utc' || tzv === 'local') airTz = tzv; } catch (e) {}
  var LOCAL_ZONE = (function () { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) { return ''; } })();
  var air = { events: null, configured: true, failed: false, at: 0 };
  $('airTz').value = airTz;
  $('airTz').addEventListener('change', function () {
    airTz = $('airTz').value;
    try { localStorage.setItem(TZ_KEY, airTz); } catch (e) {}
    renderAir();
  });

  function zoneOf() { return airTz === 'utc' ? 'UTC' : undefined; }   // undefined = this device's zone
  function dayKey(ms) {   // YYYY-MM-DD in the chosen zone
    return new Intl.DateTimeFormat('en-CA', { timeZone: zoneOf(), year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date(ms));
  }
  function airClock(ms) {
    return airTz === 'utc'
      ? new Intl.DateTimeFormat('en-GB', { timeZone: 'UTC', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(new Date(ms))
      : new Intl.DateTimeFormat(undefined, { hour: 'numeric', minute: '2-digit' }).format(new Date(ms));
  }
  function airZoneName(ms) {
    if (airTz === 'utc') return 'UTC';
    try {
      var p = new Intl.DateTimeFormat('en-US', { timeZoneName: 'short' }).formatToParts(new Date(ms));
      for (var i = 0; i < p.length; i++) if (p[i].type === 'timeZoneName') return p[i].value;
    } catch (e) {}
    return 'Local';
  }
  function airDayName(ms) {
    return new Intl.DateTimeFormat('en-US', { timeZone: zoneOf(), weekday: 'long', month: 'short', day: 'numeric' }).format(new Date(ms));
  }
  function inWords(ms) {
    var m = Math.round(ms / 60000);
    if (m < 60) return m + ' min';
    var h = Math.floor(m / 60), r = m % 60;
    if (h < 24) return h + ' h' + (r ? ' ' + r + ' min' : '');
    var d = Math.round(h / 24);
    return d + (d === 1 ? ' day' : ' days');
  }

  function loadAir(force) {
    if (!force && air.events && Date.now() - air.at < 15 * 60000) return;
    var now = Date.now();
    fetch('/api/contests?from=' + new Date(now - DAY).toISOString() + '&to=' + new Date(now + 8 * DAY).toISOString(), { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        air.configured = d.configured !== false;
        air.failed = !d.ok;
        if (d.ok) { air.events = d.events || []; air.at = Date.now(); }
        renderAir();
      })
      .catch(function () { air.failed = true; renderAir(); });
  }

  function airItem(e, now) {
    var s = Date.parse(e.start), en = Date.parse(e.end);
    var time, tag = '';
    if (e.allDay) time = 'All day';
    else time = '<span class="t">' + airClock(s) + '</span>' + (en > s ? '<span class="t">–' + airClock(en) + '</span>' : '') + '<span class="tz">' + esc(airZoneName(s)) + '</span>';
    if (!e.allDay) {
      if (now >= s && now < en) tag = '<span class="air-tag now">On now</span>';
      else if (s > now) tag = '<span class="air-tag soon">in ' + esc(inWords(s - now)) + '</span>';
      else tag = '<span class="air-tag done">Ended</span>';
    }
    // Just the first sentence of the calendar text (Tim, 2026-11-10): e.g. "CWops Test:
    // one hour; everyone welcome, members or not." The rest is on the More Info page.
    var first = (e.details || '').split('\n')[0];
    var m = first.match(/^.*?[.!?](?=\s|$)/);
    if (m) first = m[0];
    return '<li class="' + (!e.allDay && en <= now ? 'past' : '') + '"><div class="air-time">' + time + '</div>' +
      '<div class="air-what"><b>' + esc(e.title) + '</b>' + tag +
      (e.location ? '<div class="where">' + esc(e.location) + '</div>' : '') +
      (first ? '<p class="info">' + esc(first) + '</p>' : '') +
      // More Info: the event's page (Tim, 2026-11-05), on its own line under the event.
      (e.link ? '<p class="more"><a href="' + esc(e.link) + '" target="_blank" rel="noopener">More Info</a></p>' : '') +
      '</div></li>';
  }

  // A YYYY-MM-DD day key, n days on (plain calendar arithmetic).
  function addDayKey(key, n) {
    var p = key.split('-').map(Number), d = new Date(Date.UTC(p[0], p[1] - 1, p[2] + n));
    return d.toISOString().slice(0, 10);
  }
  function keyName(key) {
    var p = key.split('-').map(Number);
    return new Intl.DateTimeFormat('en-US', { timeZone: 'UTC', weekday: 'long', month: 'short', day: 'numeric' }).format(new Date(Date.UTC(p[0], p[1] - 1, p[2], 12)));
  }
  /* Up to a week of days, then fitAir() keeps only as many as fit beside
     Where My Practice Time Goes (Tim, 2026-11-06: four days made the
     page too long). On phones, where the pie is below, today and tomorrow. */
  var AIR_DAYS = 7, AIR_DAYS_PHONE = 2;

  function renderAir() {
    var box = $('air'), now = Date.now();
    if (!air.configured) { box.innerHTML = '<p class="note">On-air practice events, like the K1USN Slow Speed Test, will show here.</p>'; return; }
    if (!air.events) {
      box.innerHTML = '<p class="note">' + (air.failed ? 'Couldn&rsquo;t load the on-air events. Check your connection; this panel tries again in a few minutes.' : 'Loading on-air events&hellip;') + '</p>';
      return;
    }
    var today = dayKey(now);
    var html = '<p class="air-day">' + (airTz === 'local' && LOCAL_ZONE ? esc(LOCAL_ZONE.replace(/_/g, ' ')) + ' time' : 'UTC') + '</p>';
    for (var i = 0; i < AIR_DAYS; i++) {
      var key = addDayKey(today, i);
      var list = air.events.filter(function (e) {
        if (e.allDay) return e.date === key;
        var s = Date.parse(e.start);
        // today also keeps one that started yesterday and is still on
        return dayKey(s) === key || (i === 0 && s < now && Date.parse(e.end) > now);
      });
      html += '<div class="air-grp"><h3 class="air-dh">' + esc(i === 0 ? 'Today' : i === 1 ? 'Tomorrow' : keyName(key).split(',')[0]) +
        '<span>' + esc(keyName(key).replace(/^[A-Za-z]+, /, '')) + '</span></h3>';
      html += list.length ? '<ul class="air-list">' + list.map(function (e) { return airItem(e, now); }).join('') + '</ul>'
                          : '<p class="air-none">No on-air events.</p>';
      html += '</div>';
    }
    if (air.failed) html += '<p class="note">Showing what was loaded earlier; couldn&rsquo;t check for changes just now.</p>';
    box.innerHTML = html;
    fitAir();
  }

  // Hide days from the end until the left column (Next Class + On Air
  // Practice) is no taller than the practice time panel; today always stays.
  function fitAir() {
    var groups = Array.prototype.slice.call(document.querySelectorAll('#air .air-grp'));
    if (!groups.length) return;
    groups.forEach(function (g) { g.style.display = ''; });
    Array.prototype.forEach.call(document.querySelectorAll('#air .air-list li, #air .air-more'), function (el) {
      if (el.classList.contains('air-more')) el.remove(); else el.style.display = '';
    });
    var grid = $('lowerGrid'), col = $('air').closest('.col'), pie = $('pTitle').closest('.card');
    var beside = pie.getBoundingClientRect().left > col.getBoundingClientRect().right - 1;
    if (!beside) { groups.slice(AIR_DAYS_PHONE).forEach(function (g) { g.style.display = 'none'; }); return; }
    grid.style.alignItems = 'start';             // measure both at their own heights
    function tall() { return col.offsetHeight > pie.offsetHeight + 8; }
    for (var n = groups.length; n > 1 && tall(); n--) groups[n - 1].style.display = 'none';
    // The next day, with as many of its events as still fit and a note
    // for the rest, fills the space a whole day would overflow.
    var next = n < groups.length ? groups[n] : null;
    if (next) {
      var items = Array.prototype.slice.call(next.querySelectorAll('.air-list li')), shown = items.length;
      if (items.length) {
        var more = document.createElement('p');
        more.className = 'air-more';
        next.appendChild(more);
        next.style.display = '';
        while (shown > 0) {
          more.textContent = shown < items.length ? '+' + (items.length - shown) + ' more that day' : '';
          if (!tall()) break;
          items[--shown].style.display = 'none';
        }
        if (!shown) next.style.display = 'none';
      }
    }
    grid.style.alignItems = '';
  }
  loadAir(true);
  setInterval(function () { if (document.hidden) return; loadAir(false); renderAir(); }, 60000);

  /* ---------------- render ---------------- */
  var lastRows = [];
  function refresh() {
    return HST.history.all().then(function (all) {
      var rows = counted(all || []);
      lastRows = rows;
      var st = courseState();
      renderTiles(rows);
      renderJourney(rows, st);
      renderCourse(st);
      renderPie(rows);
      fitAir();
    }).catch(function (e) { console.error(e); });
  }
  refresh();
  HST.history.onChange(refresh);
  HST.course.onChange(refresh);
  HST.course.progress.onChange(refresh);
  var rt = null;
  window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(function () { drawJourney(); fitAir(); }, 150); });
  // The day rolls over, or a class starts: redraw every few minutes while open.
  setInterval(function () { if (!document.hidden) refresh(); }, 5 * 60000);
  window.HSTHome = { refresh: refresh };
})();
</script>
</body>
</html>
