baseURL = "https://hamshacktech.com/"
languageCode = "en-us"
title = "HamShackTech"

# Uses Hugo's built-in taxonomies (categories/tags) rather than a custom
# config — the defaults already map singular front matter fields
# (category/tag) to plural URL sections (/categories/, /tags/), which is
# exactly what we want. "categories" here are the six site-wide subject
# areas (Radio Mods, CW & Operating Skills, etc.) shared across Guides,
# Reviews, and Blog. "tags" are fine-grained (specific products/protocols).
# IMPORTANT: front matter must use the plural list form, e.g.
# categories: ["Radio Mods"]  — a bare string here will NOT register.

# Top nav, in the order it should render. "Home" links back to the
# homepage; "Guides" and "Reviews" and "Blog" point at their section's
# listing page; About/Contact are single pages.
[[menu.main]]
name = "Home"
url = "/"
weight = 5

[[menu.main]]
name = "Guides"
url = "/guides/"
weight = 10

[[menu.main]]
name = "Reviews"
url = "/reviews/"
weight = 20

[[menu.main]]
name = "Blog"
url = "/blog/"
weight = 30

[[menu.main]]
name = "About"
url = "/about/"
weight = 40

[[menu.main]]
name = "Contact"
url = "/contact/"
weight = 50

[params]
description = "HamShackTech shows amateur radio operators how to bring modern technology into the shack — remote and networked operation, radio mods, shack automation, CW and operating skills, logging and contesting, and AI in the shack."

[markup.goldmark.renderer]
unsafe = true

# Explicit module mounts: once you declare any custom mount, Hugo
# requires ALL of them spelled out (defaults no longer apply
# automatically). This keeps every normal Hugo directory working AND
# additionally mounts the existing top-level img/ folder (unchanged
# from before the Hugo migration) as static assets under /img/.
[module]
[[module.mounts]]
source = "content"
target = "content"
[[module.mounts]]
source = "layouts"
target = "layouts"
[[module.mounts]]
source = "assets"
target = "assets"
[[module.mounts]]
source = "data"
target = "data"
[[module.mounts]]
source = "i18n"
target = "i18n"
[[module.mounts]]
source = "archetypes"
target = "archetypes"
[[module.mounts]]
source = "static"
target = "static"
[[module.mounts]]
source = "img"
target = "static/img"
