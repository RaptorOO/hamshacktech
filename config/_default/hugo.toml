theme = "blowfish"
baseURL = "https://hamshacktech.com/"
languageCode = "en-us"
defaultContentLanguage = "en"
disableLanguages = []

enableRobotsTXT = true
summaryLength = 30

buildDrafts = false
buildFuture = false

enableEmoji = true

[pagination]
  pagerSize = 12

[imaging]
  anchor = 'Center'

# Uses Hugo's built-in taxonomies, same as before the migration — the
# defaults already map singular front matter (category/tag) to plural URL
# sections (/categories/, /tags/). Existing content's `categories:` and
# `tags:` front matter needs no changes.
[taxonomies]
  tag = "tags"
  category = "categories"
  author = "authors"
  series = "series"

[sitemap]
  changefreq = 'weekly'
  filename = 'sitemap.xml'
  priority = 0.5

[outputs]
  home = ["HTML", "RSS", "JSON"]

[related]
  threshold = 0
  toLower = false

    [[related.indices]]
        name = "tags"
        weight = 100

    [[related.indices]]
        name = "categories"
        weight = 100

    [[related.indices]]
        name = "date"
        weight = 10

# Explicit module mounts, carried over from the pre-Blowfish config. Once
# you declare any custom mount, Hugo requires ALL of them spelled out —
# this keeps every normal Hugo directory working AND mounts the top-level
# img/ folder as static assets under /img/, same as before.
[module]
[[module.mounts]]
source = "content"
target = "content"
[[module.mounts]]
source = "layouts"
target = "layouts"
[[module.mounts]]
source = "assets"
target = "assets"
[[module.mounts]]
source = "data"
target = "data"
[[module.mounts]]
source = "i18n"
target = "i18n"
[[module.mounts]]
source = "archetypes"
target = "archetypes"
[[module.mounts]]
source = "static"
target = "static"
[[module.mounts]]
source = "img"
target = "static/img"
# Second mount of the SAME img/ folder, this time into the assets/ pipeline
# (Hugo Pipes) rather than served-as-is under static/. This is what lets a
# content file's `featureimage:` front matter (e.g. featureimage:
# "img/guides/vail-zoomer/01-vail-adapter.png") resolve via Hugo's
# resources.Get / resources.Resize -- required for Blowfish's list/card
# thumbnails and article hero images. Files still work at /img/... via the
# static mount above; this just makes them ALSO available through the
# assets pipeline, without moving or duplicating anything on disk. (PR #12
# tried this same technique for the header logo and reverted it only
# because that whole logo attempt was scrapped, not because the mount
# itself caused any problem.)
[[module.mounts]]
source = "img"
target = "assets/img"
